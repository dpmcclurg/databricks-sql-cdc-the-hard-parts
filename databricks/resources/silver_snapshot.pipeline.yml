resources:
  pipelines:
    silver_snapshot:
      name: silver_snapshot_scd2
      # Full-refresh-safe silver: AUTO CDC FROM SNAPSHOT over bronze's current state (batch),
      # not a readChangeFeed stream. Survives a bronze full refresh and preserves SCD2 history.
      serverless: true
      catalog: ${var.catalog}
      schema: silver_snap
      configuration:
        catalog: ${var.catalog}
        bronze_schema: ${var.bronze_schema}
      libraries:
        - file:
            path: ../src/silver_snapshot_scd2.py

resources:
  jobs:
    silver_setup:
      name: silver_setup
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/setup.py
            base_parameters:
              catalog: ${var.catalog}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              ops_schema: ${var.ops_schema}
              tables: ${var.tables}
